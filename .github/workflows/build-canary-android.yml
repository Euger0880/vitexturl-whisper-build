name: Build VitextURL Canary Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-canary-android.yml'

permissions:
  contents: read

jobs:
  assemble-canary-arm64:
    name: Verify and package 
sherpa-onnx + Canary INT8
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pinned official packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 \
            -o downloads/sherpa-android.tar.bz2 \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2'
          echo '2ff63469a71cb6009aa2e3ed5f4a670f8abdcbe4bb9ffd23776afc792a6b4f44  downloads/sherpa-android.tar.bz2' | sha256sum -c -
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 \
            -o downloads/canary-int8.tar.bz2 
\
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-canary-180m-flash-en-es-de-fr-int8.tar.bz2'
          echo '7a38ed8b13f014ad632b09ff8d22e0c6f1359dd046af9235d281dfae841b9ab9  downloads/canary-int8.tar.bz2' | sha256sum -c -

      - name: Verify safe archive paths and unpack
        shell: bash
        run: |
          set -euo 
pipefail
          python3 - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          for name in ('downloads/sherpa-android.tar.bz2','downloads/canary-int8.tar.bz2'):
              with tarfile.open(name, 'r:bz2') as tar:
                  count = 0
                  for member in tar:
                      path = PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts or not (member.isfile() or 
member.isdir()):
                          raise SystemExit(f'Unsafe tar member in {name}: {member.name}')
                      count += 1
                  print(f'Archive {name}: {count} safe members')
          PY
          mkdir -p unpack/native unpack/model
          tar -xjf downloads/sherpa-android.tar.bz2 -C unpack/native --no-same-owner
          tar -xjf downloads/canary-int8.tar.bz2 -C unpack/model --no-same-owner
          # The release archive is free to add a versioned 
top-level directory.
          # Locate the actual ARM64 build by its ELF header, not path assumptions.
          python3 - <<'PYARCH'
          from pathlib import Path
          import shutil, subprocess
          root=Path('unpack/native')
          target=Path('output/src/main/jniLibs/arm64-v8a')
          target.mkdir(parents=True,exist_ok=True)
          sources=[]
          for candidate in 
root.rglob('libsherpa-onnx-jni.so'):
              header=subprocess.run(['readelf','-h',str(candidate)],capture_output=True,text=True)
              if header.returncode==0 and 'AArch64' in header.stdout:
                  sources.append(candidate.parent)
          if len(sources)!=1:
              raise SystemExit(f'Expected one ARM64 JNI library directory, got {sources}')
          
count=0
          for file in sources[0].glob('*.so'):
              header=subprocess.run(['readelf','-h',str(file)],capture_output=True,text=True)
              if header.returncode==0 and 'AArch64' in header.stdout:
                  shutil.copy2(file,target/file.name)
                  count+=1
          if count<2: raise SystemExit('Missing ONNX Runtime dependencies')
          
model_candidates=list(Path('unpack/model').rglob('encoder.int8.onnx'))
          model_dirs=[f.parent for f in model_candidates if (f.parent/'decoder.int8.onnx').is_file()
                      and (f.parent/'tokens.txt').is_file()]
          if len(model_dirs)!=1:
              raise SystemExit(f'Expected one complete Canary INT8 model, got {model_dirs}')
          model_out=Path('output/src/main/assets/stt/canary')
          
model_out.mkdir(parents=True,exist_ok=True)
          for name in ('encoder.int8.onnx','decoder.int8.onnx','tokens.txt'):
              shutil.copy2(model_dirs[0]/name,model_out/name)
          print(f'ARM64 .so libraries: {count}; Canary model: {model_dirs[0]}')
          PYARCH

      - name: Collect official Kotlin JNI bindings at matching tag
        shell: bash
        run: |
          set -euo 
pipefail
          mkdir -p output/src/main/java/com/k2fsa/sherpa/onnx
          base='https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.8/sherpa-onnx/kotlin-api'
          for file in OfflineRecognizer.kt OfflineStream.kt FeatureConfig.kt HomophoneReplacerConfig.kt QnnConfig.kt; do
            curl --fail --location --retry 3 -o 
"output/src/main/java/com/k2fsa/sherpa/onnx/${file}" "${base}/${file}"
            test -s "output/src/main/java/com/k2fsa/sherpa/onnx/${file}"
          done
          # Native libraries and model were already selected by ELF/header checks.
          ( cd output/src/main/assets/stt/canary && sha256sum encoder.int8.onnx decoder.int8.onnx tokens.txt > manifest.sha256 )
          mkdir -p 
output/third-party-notices
          curl --fail --location --retry 3 \
            -o output/third-party-notices/sherpa-onnx-LICENSE \
            'https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.8/LICENSE'
          cat > output/third-party-notices/canary-model-NOTICE.txt <<'NOTICE'
          Model: NVIDIA Canary 180M Flash, INT8 conversion by sherpa-onnx
          Original model: 
https://huggingface.co/nvidia/canary-180m-flash
          Conversion: https://github.com/k2-fsa/sherpa-onnx
          License: Creative Commons Attribution 4.0 International (CC BY 4.0)
          https://creativecommons.org/licenses/by/4.0/
          Model modifications: ONNX conversion and int8 quantization by sherpa-onnx.
          NOTICE

      - name: Verify ELF libraries and model 
integrity
        shell: bash
        run: |
          set -euo pipefail
          find output/src/main/jniLibs/arm64-v8a -maxdepth 1 -name '*.so' -print | sort
          test "$(find output/src/main/jniLibs/arm64-v8a -maxdepth 1 -name '*.so' | wc -l)" -ge 2
          for lib in output/src/main/jniLibs/arm64-v8a/*.so; do
            file "$lib"
            readelf -h "$lib" | grep -qE 
'Machine:.*AArch64'
          done
          readelf -Ws output/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so > output/SHERPA_JNI_EXPORTS.txt
          grep -q 'Java_com_k2fsa_sherpa_onnx_OfflineRecognizer_newFromFile' output/SHERPA_JNI_EXPORTS.txt
          ( cd output && find src -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          cat > output/BUILD_INFO.txt <<'INFO'
          Package: VitextURL P3 
Canary secondary ASR
          sherpa-onnx: v1.13.8, official Android JNI binaries
          Android ABI: arm64-v8a
          Canary: nvidia/canary-180m-flash via sherpa-onnx INT8
          Supported input languages: es, en, de, fr (explicit source language)
          Model original license: CC-BY-4.0
          Native archive SHA256: 2ff63469a71cb6009aa2e3ed5f4a670f8abdcbe4bb9ffd23776afc792a6b4f44
          Model archive SHA256: 
7a38ed8b13f014ad632b09ff8d22e0c6f1359dd046af9235d281dfae841b9ab9
          Does not require Android NDK inside AndroidIDE.
          Not an APK; requires Kotlin composition and on-device validation.
          INFO

      - name: Upload verified P3 Android libraries and model
        uses: actions/upload-artifact@v4
        with:
          name: vitexturl-canary-p3-android-arm64
          path: 
output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
