name: Build VitextURL Whisper Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-whisper-android.yml
      - vitexturl-whisper-inputs.zip

permissions:
  contents: read

jobs:
  build-arm64:
    name: Compile JNI for Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Fetch this repository
        uses: actions/checkout@v4

      - name: Java for Android command-line tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.2.12479018'
          NDK_DIR="${ANDROID_HOME}/ndk/27.2.12479018"
          test -f "${NDK_DIR}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "${GITHUB_ENV}"
          echo 'NDK version:'
          cat "${NDK_DIR}/source.properties"

      - name: Verify exact source package and unpack
        shell: bash
        run: |
          set -euo pipefail
          test -f vitexturl-whisper-inputs.zip
          echo '64aa8311e9f4ba1ef2e6ccf600e615c99b7265624c795faf4356c0f869f7eb0c  vitexturl-whisper-inputs.zip' | sha256sum -c -
          mkdir -p inputs
          unzip -q vitexturl-whisper-inputs.zip -d inputs
          test -f inputs/whisper.cpp-master/include/whisper.h
          test -f inputs/whisper.cpp-master/ggml/CMakeLists.txt
          test -f inputs/native/vitext_whisper_jni.cpp
          test -f inputs/native/CMakeLists.txt
          test -f inputs/native/WhisperNative.kt

      - name: Configure Android JNI build
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          cmake -S inputs/native -B build-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_SOURCE_DIR="${GITHUB_WORKSPACE}/inputs/whisper.cpp-master" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LTO=OFF

      - name: Compile native library
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-arm64 --parallel 4 --target vitext_whisper_jni
          test -s build-arm64/libvitext_whisper_jni.so

      - name: Verify Android ARM64 binary and JNI exports
        shell: bash
        run: |
          set -euo pipefail
          LIB='build-arm64/libvitext_whisper_jni.so'
          BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p output/jniLibs/arm64-v8a output/kotlin/com/vitexturl/app/stt
          "${BIN}/llvm-strip" --strip-debug "${LIB}"
          "${BIN}/llvm-readelf" -h "${LIB}" | tee output/ELF_HEADER.txt
          grep -qE 'Machine:.*AArch64' output/ELF_HEADER.txt
          "${BIN}/llvm-readelf" -d "${LIB}" | tee output/ELF_DYNAMIC.txt
          if grep -E 'NEEDED.*(libwhisper\.so|libggml[^ ]*\.so|libc\+\+_shared\.so)' output/ELF_DYNAMIC.txt; then
            echo 'ERROR: Unexpected dynamic library dependency' >&2
            exit 1
          fi
          "${BIN}/llvm-nm" -D --defined-only "${LIB}" | tee output/EXPORTED_SYMBOLS.txt
          grep -q 'Java_com_vitexturl_app_stt_WhisperNative_createContext' output/EXPORTED_SYMBOLS.txt
          grep -q 'Java_com_vitexturl_app_stt_WhisperNative_transcribe' output/EXPORTED_SYMBOLS.txt
          grep -q 'Java_com_vitexturl_app_stt_WhisperNative_cancel' output/EXPORTED_SYMBOLS.txt
          grep -q 'Java_com_vitexturl_app_stt_WhisperNative_releaseContext' output/EXPORTED_SYMBOLS.txt
          cp "${LIB}" output/jniLibs/arm64-v8a/libvitext_whisper_jni.so
          cp inputs/native/WhisperNative.kt output/kotlin/com/vitexturl/app/stt/WhisperNative.kt
          cat > output/BUILD_INFO.txt <<INFO
          Native library: libvitext_whisper_jni.so
          Android ABI: arm64-v8a
          Min Android API: 26
          Android NDK: 27.2.12479018 (r27c)
          C++ runtime: c++_static
          whisper.cpp source: user's whisper.cpp-master.zip
          Source bundle SHA-256: 64aa8311e9f4ba1ef2e6ccf600e615c99b7265624c795faf4356c0f869f7eb0c
          Workflow commit: ${GITHUB_SHA}
          Model NOT included; ggml-base.bin stays outside this public repository.
          Native cross-compilation only; runtime and recognition on device NOT yet tested.
          INFO
          (cd output && sha256sum jniLibs/arm64-v8a/libvitext_whisper_jni.so > SHA256SUMS.txt)

      - name: Publish downloadable Android native artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitexturl-whisper-android-arm64
          path: output/
          if-no-files-found: error
          retention-days: 30

